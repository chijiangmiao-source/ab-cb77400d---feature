# Calibration subnet audit orchestration.
#
# Services:
#   api     -- the HTTP solver; the host port is configurable via
#              AUDIT_HOST_PORT (default 8080) and health is probed on
#              GET /healthz. Asynchronous audit jobs are persisted in a
#              SQLite database on the `audit-data` volume, so jobs survive
#              container restarts and are recovered (running -> queued) on
#              startup.
#   verify  -- one-shot verification run: solver unit tests, build artifact
#              checks, HTTP smoke tests (canonical tie arbitration,
#              infeasibility boundaries) and async job smoke tests. The job
#              tests submit real jobs, SIGKILL the api container mid-flight
#              through the Docker socket (Compose restarts it via its
#              restart policy), then poll the recovered job to its verdict,
#              re-check idempotent replay/conflict and the synchronous
#              endpoint. It exits 0 on success and non-zero on any failure,
#              then stops.
#
# Typical use:
#   AUDIT_HOST_PORT=9090 docker compose build
#   AUDIT_HOST_PORT=9090 docker compose up --abort-on-container-exit --exit-code-from verify

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: calibration-audit:latest
    environment:
      AUDIT_HOST: 0.0.0.0
      AUDIT_PORT: "8080"
      AUDIT_DATA_DIR: "/app/data"
    volumes:
      # Durable job store: idempotent submissions and crash recovery must
      # survive container restarts.
      - audit-data:/app/data
    ports:
      # Host-side port is configurable; container port stays 8080.
      - "${AUDIT_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  verify:
    image: calibration-audit:latest
    # Same image as `api` (identical build -> Compose de-duplicates the build);
    # only the command differs.
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "tests/verify.py"]
    environment:
      AUDIT_BASE_URL: "http://api:8080"
      STEINER_CORE: "/app/core/steiner"
      DOCKER_SOCKET: "/var/run/docker.sock"
    volumes:
      # Lets the job smoke tests SIGKILL the api container to simulate a
      # crash; Compose's restart policy brings it back for the recovery
      # assertions. Read-only usage (container lookup + kill).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  audit-data:
