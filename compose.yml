# Calibration subnet audit orchestration.
#
# Services:
#   api     -- the HTTP solver; the host port is configurable via
#              AUDIT_HOST_PORT (default 8080) and health is probed on
#              GET /healthz. Async audit jobs are persisted in the
#              `audit-jobs` volume so they survive restarts.
#   verify  -- one-shot verification run: solver/job unit tests, build
#              artifact checks and HTTP smoke tests (including canonical tie
#              arbitration, infeasibility boundaries and the async job API).
#              It exits 0 on success and non-zero on any failure, then stops.
#
# Typical use:
#   AUDIT_HOST_PORT=9090 docker compose build
#   AUDIT_HOST_PORT=9090 docker compose up --abort-on-container-exit --exit-code-from verify
#
# Full async acceptance (submit -> hard-kill mid-computation -> restart ->
# poll the conclusion; idempotency conflicts; sync endpoint regression):
#   python3 scripts/acceptance_jobs.py

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: calibration-audit:latest
    environment:
      AUDIT_HOST: 0.0.0.0
      AUDIT_PORT: "8080"
      AUDIT_JOB_DB: /app/data/jobs.sqlite3
      # Test/demo hook (normally 0): artificial delay while a job is in
      # `running`, giving the crash-recovery acceptance a reliable kill
      # window. Override with e.g. AUDIT_JOB_DELAY_SECONDS=3 docker compose up -d api
      AUDIT_JOB_DELAY_SECONDS: "${AUDIT_JOB_DELAY_SECONDS:-0}"
    volumes:
      # Durable async-job store: queued/running jobs survive restarts.
      - audit-jobs:/app/data
    ports:
      # Host-side port is configurable; container port stays 8080.
      - "${AUDIT_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  verify:
    image: calibration-audit:latest
    # Same image as `api` (identical build -> Compose de-duplicates the build);
    # only the command differs.
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "tests/verify.py"]
    environment:
      AUDIT_BASE_URL: "http://api:8080"
      STEINER_CORE: "/app/core/steiner"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  audit-jobs:
